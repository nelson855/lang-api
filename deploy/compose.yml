# LANG-P1-02 本地五服务环境（主文件）
# 项目名固定为 lang-api，Docker 里显示为 lang-api 分组，避免随文件夹名变化。
name: lang-api
# 启动：docker compose --env-file deploy/.env -f deploy/compose.yml up -d --build
# 普通停止（保留卷）：docker compose -f deploy/compose.yml stop
# 普通删除容器（保留卷）：docker compose -f deploy/compose.yml down
# 彻底重置（删除卷，不可恢复，见运行手册独立章节）：docker compose -f deploy/compose.yml down -v
#
# 版本冻结说明：外部镜像使用 tag + digest 双重锁定。
# digest 于 2026-09-12 经仓库元数据查询核验（直连官方仓库超时，改走可达镜像站，
# 内容寻址保证指纹与官方一致），核验过程见 docs/new-api/基线版本与许可证.md。

services:
  edge-nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      lang-api:
        condition: service_healthy
    ports:
      - "${EDGE_HTTP_PORT:-8081}:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
      - relay
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  lang-api:
    build:
      context: ..
      dockerfile: Dockerfile
      # 与 docs/07 规定的 docker build 命令等价：Maven 配置经 BuildKit secret 注入，不进镜像层。
      # 注意：这里用项目自带的 deploy/maven-settings.docker.xml（公网镜像，无口令），
      # 不用个人全局 settings.xml（公司内网仓库在构建容器里连不上）。
      secrets:
        - maven_settings
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      new-api:
        condition: service_healthy
    networks:
      - web
      - control
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  new-api:
    image: calciumion/new-api:v0.13.2@sha256:0c6aa7afce4747f0fc4fab9c7934d7c2e4b69fda6844065acca6a5e1bf258506
    environment:
      SQL_DSN: "postgres://${POSTGRES_USER:?请在 deploy/.env 设置 POSTGRES_USER}:${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?请在 deploy/.env 设置 POSTGRES_DB}?sslmode=disable"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD:?请在 deploy/.env 设置 REDIS_PASSWORD}@redis:6379/0"
      SESSION_SECRET: "${SESSION_SECRET:?请在 deploy/.env 设置 SESSION_SECRET}"
      CRYPTO_SECRET: "${CRYPTO_SECRET:?请在 deploy/.env 设置 CRYPTO_SECRET}"
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - newapi-data:/data
      - newapi-logs:/log
    networks:
      - control
      - relay
      - data
      - egress
    healthcheck:
      # /api/status 以 GET 返回 200（HEAD 返回 404，故必须用 GET 探测）；首次初始化前后语义见运行手册。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?请在 deploy/.env 设置 POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?请在 deploy/.env 设置 POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD}"
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请在 deploy/.env 设置 REDIS_PASSWORD}"
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]
    volumes:
      - redisdata:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  web:
  control:
    internal: true
  relay:
    internal: true
  data:
    internal: true
  egress:

volumes:
  pgdata:
  redisdata:
  newapi-data:
  newapi-logs:

secrets:
  maven_settings:
    file: ./maven-settings.docker.xml
