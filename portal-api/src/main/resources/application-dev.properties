# 本地开发环境差异（无真实密钥，敏感值由环境变量或外部配置覆盖）
lang.env=dev
logging.level.com.lang=DEBUG
# 开发默认走 Compose 内网名，允许环境变量 NEW_API_BASE_URL 覆盖；不写真实域名或凭证
lang.upstream.new-api.base-url=${NEW_API_BASE_URL:http://new-api:3000}
lang.portal.cookie.secure=false
lang.auth.registration.enabled=${PORTAL_REGISTRATION_ENABLED:true}
lang.auth.cookie.secure=false
lang.auth.allowed-origins=${PORTAL_ALLOWED_ORIGINS:http://localhost:5173}
lang.auth.trusted-proxy.cidrs=${PORTAL_TRUSTED_PROXY_CIDRS:172.16.0.0/12}
lang.portal.site-name=${PORTAL_SITE_NAME:Lang API}
# LANG-P1-07：本地默认发布 OPENAI，地址与网关模型站点一致；
# Compose 会显式注入 PORTAL_ENABLED_PROTOCOLS 与 PORTAL_OPENAI_URL。
lang.portal.enabled-protocols=${PORTAL_ENABLED_PROTOCOLS:OPENAI}
lang.portal.public-urls.openai=${PORTAL_OPENAI_URL:http://api.localhost:8081/v1}
lang.portal.public-urls.anthropic=${PORTAL_ANTHROPIC_URL:}
lang.portal.public-urls.gemini=${PORTAL_GEMINI_URL:}
# 开发环境 API Key 策略：沿用共享默认，显式声明以保持三环境一致
lang.api-key.default-page-size=20
lang.api-key.max-page-size=100
lang.api-key.reveal-ttl=60s
lang.api-key.status-aggregation-max-pages=20

lang.portal.catalog.quota-per-usd=500000
lang.portal.catalog.cache-ttl=60s
# LANG-P1-09：基础用量共享默认，保持四环境显式一致
lang.portal.usage.default-range=24h
lang.portal.usage.max-range=720h
lang.portal.usage.default-page-size=20
lang.portal.usage.max-page-size=100
