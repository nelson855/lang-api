# 本地开发环境差异（无真实密钥，敏感值由环境变量或外部配置覆盖）
lang.env=dev
logging.level.com.lang=DEBUG
# 开发默认走 Compose 内网名，允许环境变量 NEW_API_BASE_URL 覆盖；不写真实域名或凭证
lang.upstream.new-api.base-url=${NEW_API_BASE_URL:http://new-api:3000}
lang.portal.cookie.secure=false
lang.portal.site-name=${PORTAL_SITE_NAME:Lang API}
lang.portal.enabled-protocols=
lang.portal.public-urls.openai=${PORTAL_OPENAI_URL:}
lang.portal.public-urls.anthropic=${PORTAL_ANTHROPIC_URL:}
lang.portal.public-urls.gemini=${PORTAL_GEMINI_URL:}
