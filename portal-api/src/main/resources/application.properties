spring.application.name=lang-api
# 静态资源由正式构建装配到 classpath:/static，不使用默认映射以外的自定义路径
spring.web.resources.add-mappings=false
# 执行器最小暴露：只开放健康与版本信息
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# 受控版本信息：应用名固定，版本号由构建期 build-info 从 Maven 版本派生
#（显式开启 info.* 暴露：3.5 默认关闭 env 分组以避免泄露，只放行本文件的受控键）
management.info.env.enabled=true
info.app.name=lang-api
