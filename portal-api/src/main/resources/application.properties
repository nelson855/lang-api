spring.application.name=lang-api
# 静态资源由正式构建装配到 classpath:/static，不使用默认映射以外的自定义路径
spring.web.resources.add-mappings=false
# 执行器最小暴露：只开放健康与版本信息
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# 受控版本信息：应用名固定，版本号由构建期 build-info 从 Maven 版本派生
#（显式开启 info.* 暴露：3.5 默认关闭 env 分组以避免泄露，只放行本文件的受控键）
management.info.env.enabled=true
info.app.name=lang-api
# Portal API 共享基础：正文上限 1 MiB、requestId 规则、连接池与超时、Cookie 与站点公开配置键
lang.request.max-body-bytes=1048576
lang.request.request-id.min-length=8
lang.request.request-id.max-length=64
lang.upstream.new-api.pool.max-connections=50
lang.upstream.new-api.pool.max-pending-acquire=100
lang.upstream.new-api.pool.acquire-timeout=1s
lang.upstream.new-api.pool.max-idle-time=30s
lang.upstream.new-api.pool.max-life-time=5m
lang.upstream.new-api.connect-timeout=2s
lang.upstream.new-api.read-timeout=5s
lang.upstream.new-api.write-timeout=5s
lang.portal.site-name=Lang API
# LANG-P1-07：公共协议共享入口。当前只接受 OPENAI，且地址必须是以 /v1 结束的
# 绝对 HTTP(S) 地址（见 PortalPropertiesValidator）；各环境按需覆盖。
lang.portal.enabled-protocols=
lang.portal.public-urls.openai=
lang.portal.cookie.path=/portal
lang.portal.cookie.same-site=Lax
# 认证会话的浏览器边界：仅使用 Lang API 自有 Cookie 名，不配置 Domain。
lang.auth.cookie.session-name=LANG_SESSION
lang.auth.cookie.user-id-name=LANG_UID
lang.auth.cookie.path=/portal
lang.auth.cookie.same-site=Lax
lang.auth.cookie.max-age=30d
lang.auth.csrf.cookie-name=XSRF-TOKEN
lang.auth.csrf.header-name=X-XSRF-TOKEN
lang.auth.csrf.path=/portal
lang.auth.csrf.same-site=Lax
lang.auth.origin-check-enabled=true
lang.auth.trusted-proxy.forwarded-for-header=X-Forwarded-For
lang.auth.rate-limit.login.username-attempts=5
lang.auth.rate-limit.login.client-attempts=20
lang.auth.rate-limit.login.window=5m
lang.auth.rate-limit.register.client-attempts=3
lang.auth.rate-limit.register.window=1h
# API Key 共享默认：分页、敏感值短时窗口与状态筛选聚合上限
lang.api-key.default-page-size=20
lang.api-key.max-page-size=100
lang.api-key.reveal-ttl=60s
lang.api-key.status-aggregation-max-pages=20

# LANG-P1-08：模型目录计费与缓存。quota-per-usd 必须与目标 New API 的 quota_per_unit 一致
lang.portal.catalog.quota-per-usd=500000
lang.portal.catalog.cache-ttl=60s

# LANG-P1-09：基础用量共享默认。时间默认最近 24 小时、最大 30 天；日志默认分页 20、最大 100
lang.portal.usage.default-range=24h
lang.portal.usage.max-range=720h
lang.portal.usage.default-page-size=20
lang.portal.usage.max-page-size=100
