# 生产环境默认值（无真实地址与密钥；敏感值必须由环境变量或外部 .properties 提供）
lang.env=prod
logging.level.com.lang=INFO
# 生产要求结构化 JSON 日志
logging.structured.format.console=ecs
# New API 地址必须由外部提供，不在仓库写真实地址
lang.upstream.new-api.base-url=${NEW_API_BASE_URL:}
lang.portal.cookie.secure=true
lang.auth.registration.enabled=${PORTAL_REGISTRATION_ENABLED:false}
lang.auth.cookie.secure=true
lang.auth.allowed-origins=${PORTAL_ALLOWED_ORIGINS:}
lang.auth.trusted-proxy.cidrs=${PORTAL_TRUSTED_PROXY_CIDRS:}
lang.portal.site-name=${PORTAL_SITE_NAME:}
lang.portal.enabled-protocols=${PORTAL_ENABLED_PROTOCOLS:}
lang.portal.public-urls.openai=${PORTAL_OPENAI_URL:}
lang.portal.public-urls.anthropic=${PORTAL_ANTHROPIC_URL:}
lang.portal.public-urls.gemini=${PORTAL_GEMINI_URL:}
# 生产环境 API Key 边界：显式声明且不得放宽安全约束（CSRF/Origin/no-store/明文清除由代码强制，不可配置关闭）
lang.api-key.default-page-size=20
lang.api-key.max-page-size=100
lang.api-key.reveal-ttl=60s
lang.api-key.status-aggregation-max-pages=20

lang.portal.catalog.quota-per-usd=${PORTAL_CATALOG_QUOTA_PER_USD:500000}
lang.portal.catalog.cache-ttl=60s
# LANG-P1-09：基础用量共享默认，保持四环境显式一致
lang.portal.usage.default-range=24h
lang.portal.usage.max-range=720h
lang.portal.usage.default-page-size=20
lang.portal.usage.max-page-size=100
