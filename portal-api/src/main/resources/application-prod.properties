# 生产环境默认值（无真实地址与密钥；敏感值必须由环境变量或外部 .properties 提供）
lang.env=prod
logging.level.com.lang=INFO
# 生产要求结构化 JSON 日志
logging.structured.format.console=ecs
# New API 地址必须由外部提供，不在仓库写真实地址
lang.upstream.new-api.base-url=${NEW_API_BASE_URL:}
lang.portal.cookie.secure=true
lang.auth.registration.enabled=${PORTAL_REGISTRATION_ENABLED:false}
lang.auth.cookie.secure=true
lang.auth.allowed-origins=${PORTAL_ALLOWED_ORIGINS:}
lang.auth.trusted-proxy.cidrs=${PORTAL_TRUSTED_PROXY_CIDRS:}
lang.portal.site-name=${PORTAL_SITE_NAME:}
# LANG-P1-10：生产环境资料更新限流显式声明，次数可由环境变量收紧或放宽
lang.auth.rate-limit.profile-update.user-attempts=${PORTAL_PROFILE_UPDATE_USER_ATTEMPTS:10}
lang.auth.rate-limit.profile-update.client-attempts=${PORTAL_PROFILE_UPDATE_CLIENT_ATTEMPTS:30}
lang.auth.rate-limit.profile-update.window=10m
lang.portal.enabled-protocols=${PORTAL_ENABLED_PROTOCOLS:}
lang.portal.public-urls.openai=${PORTAL_OPENAI_URL:}
lang.portal.public-urls.anthropic=${PORTAL_ANTHROPIC_URL:}
lang.portal.public-urls.gemini=${PORTAL_GEMINI_URL:}
# 生产环境 API Key 边界：显式声明且不得放宽安全约束（CSRF/Origin/no-store/明文清除由代码强制，不可配置关闭）
lang.api-key.default-page-size=20
lang.api-key.max-page-size=100
lang.api-key.reveal-ttl=60s
lang.api-key.status-aggregation-max-pages=20

lang.portal.catalog.quota-per-usd=${PORTAL_CATALOG_QUOTA_PER_USD:500000}
lang.portal.catalog.cache-ttl=60s
# LANG-P1-09：基础用量共享默认，保持四环境显式一致
lang.portal.usage.default-range=24h
lang.portal.usage.max-range=720h
lang.portal.usage.default-page-size=20
lang.portal.usage.max-page-size=100

# LANG-P2-02：生产环境聚合基础显式声明，默认收紧，只能随新基线显式放宽
lang.aggregation.baseline-version=p2-2026-09-22-a
lang.aggregation.page-size=20
lang.aggregation.max-pages=10
lang.aggregation.max-records=200
lang.aggregation.single-call-timeout=5s
lang.aggregation.total-timeout=30s
lang.aggregation.max-live-log-range=168h
lang.aggregation.cache-ttl=30s
lang.aggregation.cache-maximum-size=1000
lang.aggregation.five-minutes-max-span=24h
lang.aggregation.hour-max-span=168h
lang.aggregation.day-max-span=720h

lang.publication.mode=${PORTAL_PUBLICATION_MODE:PREVIEW}
lang.public.site-url=${PORTAL_SITE_URL:}
lang.public.support-url=${PORTAL_SUPPORT_URL:}
lang.public.supported-regions=${PORTAL_SUPPORTED_REGIONS:}
lang.public.enabled-locales=${PORTAL_ENABLED_LOCALES:zh-CN}
lang.legal.source-locale=${PORTAL_LEGAL_SOURCE_LOCALE:zh-CN}
lang.legal.source-format=${PORTAL_LEGAL_SOURCE_FORMAT:MARKDOWN}
lang.legal.max-input-bytes=${PORTAL_LEGAL_MAX_INPUT_BYTES:262144}
lang.legal.max-output-bytes=${PORTAL_LEGAL_MAX_OUTPUT_BYTES:262144}
lang.legal.cache-ttl=${PORTAL_LEGAL_CACHE_TTL:5m}
