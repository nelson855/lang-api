# 自动化测试环境差异（无真实密钥）
lang.env=test
logging.level.com.lang=WARN
# 默认不可达回环，避免误连真实服务；契约测试用动态属性覆盖为 MockWebServer 地址
lang.upstream.new-api.base-url=${NEW_API_BASE_URL:http://127.0.0.1:1}
lang.upstream.new-api.pool.max-connections=5
lang.upstream.new-api.pool.max-pending-acquire=5
lang.upstream.new-api.pool.acquire-timeout=500ms
lang.upstream.new-api.connect-timeout=500ms
lang.upstream.new-api.read-timeout=1s
lang.upstream.new-api.write-timeout=1s
lang.portal.cookie.secure=false
lang.auth.registration.enabled=true
lang.auth.cookie.secure=false
lang.auth.allowed-origins=http://portal.test
lang.auth.trusted-proxy.cidrs=127.0.0.1/32
lang.auth.rate-limit.login.window=10s
lang.auth.rate-limit.register.window=10s
lang.portal.site-name=Lang API Test
lang.portal.enabled-protocols=
lang.portal.public-urls.openai=
lang.portal.public-urls.anthropic=
lang.portal.public-urls.gemini=
# 测试环境 API Key 策略：更短敏感值窗口与确定性聚合预算，保证超时和清除测试稳定
lang.api-key.default-page-size=20
lang.api-key.max-page-size=100
lang.api-key.reveal-ttl=5s
lang.api-key.status-aggregation-max-pages=5
