schema: spec-driven

context: |
  OpenSpec change directory names must use the format
  YYYY-MM-DD-<requirement-id>-<kebab-case-description>. Keep an existing
  requirement id when one is provided, for example:
  2026-09-12-lang-p1-01-engineering-baseline-integrated-build.

  Backend configuration must use .properties files, not YAML. Put shared
  configuration in application.properties and environment-specific
  configuration in application-dev.properties, application-test.properties,
  and application-prod.properties. The dev, test, and prod environments must
  remain explicitly separated.

rules:
  design:
    - Backend configuration designs must use .properties files and cover dev, test, and prod profiles.
  tasks:
    - Include explicit tasks for application.properties and the dev, test, and prod profile files whenever backend configuration is in scope.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
