# LANG-P1-07 公共模型网关模板（任务 2.2/2.3/2.4/3.1-3.5/4.1-4.5/5.1-5.6）。
# 由 gateway/Dockerfile 烘焙进自有 edge 镜像，官方入口只替换
# NGINX_ENVSUBST_FILTER 允许的变量；Nginx 自身变量保持原样。
# 两个虚拟主机共享一个容器和端口，但路由表完全分离：
# 用户站点只服务页面与 Portal 控制面，模型站点只开放两条 OpenAI 精确路径。

# 边缘速率与并发保护（任务 4.3）：按客户端地址隔离。
limit_req_zone $binary_remote_addr zone=model_req_limit:10m rate=${GATEWAY_RATE_LIMIT};
limit_conn_zone $binary_remote_addr zone=model_conn_limit:10m;

# 安全结果类别映射（任务 5.5）：只看状态码与响应内容类型，
# 不接触路径、凭证、正文或地址。
map "$status:$sent_http_content_type" $gateway_status_result {
  ~^499               client_cancelled;
  ~^200:.*event-stream  stream_completed;
  ~^20[01]            success;
  ~^401               auth_rejected;
  ~^404               not_found;
  ~^405               method_rejected;
  ~^413               payload_too_large;
  ~^429               rate_limited;
  ~^400               upstream_rejected;
  ~^403               forbidden;
  ~^409               upstream_rejected;
  ~^422               upstream_rejected;
  ~^500               gateway_unavailable;
  ~^502               gateway_unavailable;
  ~^503               gateway_unavailable;
  ~^504               gateway_timeout;
  default             ok;
}

# SSE 已开始响应后，客户端取消仍会保留 200 状态；用请求完成标记纠正结果类别。
map "$request_completion:$gateway_status_result" $gateway_result {
  ~^:stream_completed$  client_cancelled;
  default               $gateway_status_result;
}

# 模型数据面访问日志（任务 5.5/5.6）：只记录时间、网关 requestId、
# 方法、规范化路由、状态、耗时与安全结果类别。
log_format model_json escape=json '{"time":"$time_iso8601","requestId":"$request_id","method":"$request_method","route":"$model_route","status":$status,"requestTime":"$request_time","upstreamHeaderTime":"$upstream_header_time","upstreamResponseTime":"$upstream_response_time","result":"$gateway_result"}';

upstream lang_api {
  server lang-api:8080;
}

# 单一 Relay upstream，无备用节点，配合 proxy_next_upstream off
# 保证一次客户端请求最多触发一次 Relay 调用（任务 4.5）。
upstream new_api_relay {
  server new-api:3000;
}

# 用户站点：页面、Portal 控制面与健康检查（任务 2.3）。
# 作为默认站点，localhost / 127.0.0.1 等未声明 Host 继续落到这里。
server {
  listen 80 default_server;
  server_name ${PORTAL_SERVER_NAME};

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Lang API 页面与静态资源
  location / {
    proxy_pass http://lang_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Portal 控制面接口
  location /portal/api/ {
    proxy_pass http://lang_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 用户站点不开放任何模型与管理路径（P1-02 既有边界，原样迁移）。
  location /v1/ {
    return 404 '{"requestId":"$request_id","error":{"code":"NOT_FOUND","message":"模型网关未开放该路径","type":"gateway_error"}}';
  }

  location /v1beta/ {
    return 404 '{"requestId":"$request_id","error":{"code":"NOT_FOUND","message":"模型网关未开放该路径","type":"gateway_error"}}';
  }

  location /api/ {
    return 404 '{"requestId":"$request_id","error":{"code":"NOT_FOUND","message":"请求的 Portal 接口不存在","type":"gateway_error"}}';
  }

  location /setup/ {
    return 404 '{"requestId":"$request_id","error":{"code":"NOT_FOUND","message":"请求的 Portal 接口不存在","type":"gateway_error"}}';
  }
}

# 模型 API 站点（任务 2.4/3.1/4.1-4.5/5.1-5.6）。
server {
  listen 80;
  server_name ${MODEL_API_SERVER_NAME};
  server_tokens off;
  default_type application/json;
  charset utf-8;

  access_log /var/log/nginx/model-access.log model_json;
  error_log /var/log/nginx/error.log warn;

  # 规范化路由：精确路径各自覆盖，未命中记为 unmatched（任务 5.5）。
  set $model_route unmatched;

  # 响应统一不缓存、不压缩（任务 4.4/5.4）。
  gzip off;
  add_header X-Request-Id $request_id always;
  add_header Cache-Control "no-store" always;

  # 资源边界（任务 4.1-4.3）：正文上限在接触 Relay 前生效，
  # 超速率/超并发返回自有 429。
  client_max_body_size ${GATEWAY_CLIENT_MAX_BODY};
  limit_req zone=model_req_limit burst=${GATEWAY_RATE_BURST} nodelay;
  limit_req_status 429;
  limit_conn model_conn_limit ${GATEWAY_CONN_LIMIT};
  limit_conn_status 429;

  # 自有 413/429 与可拦截上游错误的稳定 JSON 映射（任务 5.1）。
  # 说明：自有 401/404/405 用带正文的直接返回（天然绕过 error_page），
  # 因此同码的 error_page 目标只承接上游拦截，两者不会混淆。
  error_page 413 @payload_too_large;
  error_page 429 @rate_limited;
  error_page 400 @upstream_400;
  error_page 404 @upstream_404;
  error_page 409 @upstream_409;
  error_page 422 @upstream_422;
  error_page 401 @auth_failed;
  error_page 403 @forbidden;
  error_page 500 502 503 =502 @gateway_unavailable;
  error_page 504 @gateway_timeout;

  # 聊天完成接口：仅 POST，直接进入 New API Relay，不经过 Portal API。
  location = /v1/chat/completions {
    set $model_route chat_completions;
    if ($request_method != POST) {
      return 405 '{"requestId":"$request_id","error":{"code":"METHOD_NOT_ALLOWED","message":"仅支持 POST","type":"gateway_error"}}';
    }
    if ($http_authorization !~* "^Bearer [^ ]+$") {
      return 401 '{"requestId":"$request_id","error":{"code":"AUTHENTICATION_REQUIRED","message":"需要合法的 Bearer Key","type":"gateway_error"}}';
    }
    proxy_pass http://new_api_relay;
    proxy_http_version 1.1;
    # 关闭默认整包转发后逐项重建（任务 3.4）。
    proxy_pass_request_headers off;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Accept $http_accept;
    proxy_set_header Host new-api:3000;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";
    # 先完整接收并执行正文边界，再向上游发送（任务 4.1）。
    proxy_request_buffering on;
    # 超时走模板变量（任务 4.2）。
    proxy_connect_timeout ${GATEWAY_CONNECT_TIMEOUT};
    proxy_send_timeout ${GATEWAY_SEND_TIMEOUT};
    proxy_read_timeout ${GATEWAY_READ_TIMEOUT};
    # 响应不缓冲/不缓存，逐块透传 SSE（任务 4.4）。
    proxy_buffering off;
    proxy_cache off;
    # 丢弃上游错误正文，改走稳定映射（任务 5.1/5.2）。
    proxy_intercept_errors on;
    # 客户端取消向上传播，禁用一切自动重试（任务 4.5）。
    proxy_ignore_client_abort off;
    proxy_next_upstream off;
    # 移除上游品牌、内部标识与缓存调试 Header（任务 5.4）。
    proxy_hide_header Server;
    proxy_hide_header ETag;
    proxy_hide_header Age;
    proxy_hide_header Via;
    proxy_hide_header X-Cache;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Accel-Redirect;
    proxy_hide_header X-Accel-Limit-Rate;
    proxy_hide_header X-Accel-Buffering;
    proxy_hide_header X-Accel-Charset;
    proxy_hide_header X-Request-Id;
    proxy_hide_header New-Api-User;
  }

  # 模型列表：仅 GET，直接进入 New API Relay。
  location = /v1/models {
    set $model_route models;
    if ($request_method != GET) {
      return 405 '{"requestId":"$request_id","error":{"code":"METHOD_NOT_ALLOWED","message":"仅支持 GET","type":"gateway_error"}}';
    }
    if ($http_authorization !~* "^Bearer [^ ]+$") {
      return 401 '{"requestId":"$request_id","error":{"code":"AUTHENTICATION_REQUIRED","message":"需要合法的 Bearer Key","type":"gateway_error"}}';
    }
    proxy_pass http://new_api_relay;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Accept $http_accept;
    proxy_set_header Host new-api:3000;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";
    proxy_request_buffering on;
    proxy_connect_timeout ${GATEWAY_CONNECT_TIMEOUT};
    proxy_send_timeout ${GATEWAY_SEND_TIMEOUT};
    proxy_read_timeout ${GATEWAY_READ_TIMEOUT};
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors on;
    proxy_ignore_client_abort off;
    proxy_next_upstream off;
    proxy_hide_header Server;
    proxy_hide_header ETag;
    proxy_hide_header Age;
    proxy_hide_header Via;
    proxy_hide_header X-Cache;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Accel-Redirect;
    proxy_hide_header X-Accel-Limit-Rate;
    proxy_hide_header X-Accel-Buffering;
    proxy_hide_header X-Accel-Charset;
    proxy_hide_header X-Request-Id;
    proxy_hide_header New-Api-User;
  }

  # 未声明的模型前缀（/v1/responses、尾随斜杠、子路径等）不得触达 Relay。
  location /v1/ {
    return 404 '{"requestId":"$request_id","error":{"code":"NOT_FOUND","message":"模型网关未开放该路径","type":"gateway_error"}}';
  }

  location /v1beta/ {
    return 404 '{"requestId":"$request_id","error":{"code":"NOT_FOUND","message":"模型网关未开放该路径","type":"gateway_error"}}';
  }

  # 模型站点不服务页面、Portal 控制面与 New API 管理面。
  location /portal/api/ {
    return 404 '{"requestId":"$request_id","error":{"code":"NOT_FOUND","message":"模型网关未开放该路径","type":"gateway_error"}}';
  }

  location /api/ {
    return 404 '{"requestId":"$request_id","error":{"code":"NOT_FOUND","message":"模型网关未开放该路径","type":"gateway_error"}}';
  }

  location /setup/ {
    return 404 '{"requestId":"$request_id","error":{"code":"NOT_FOUND","message":"模型网关未开放该路径","type":"gateway_error"}}';
  }

  # 兜底：其余一切路径自有 404，不暴露上游信息。
  location / {
    return 404 '{"requestId":"$request_id","error":{"code":"NOT_FOUND","message":"模型网关未开放该路径","type":"gateway_error"}}';
  }

  # 稳定错误位置（任务 5.1/5.2）：只返回自有 JSON，不再转发，
  # 不含上游品牌、私网地址、渠道或凭证。
  location @payload_too_large {
    internal;
    return 413 '{"requestId":"$request_id","error":{"code":"PAYLOAD_TOO_LARGE","message":"请求正文过大","type":"gateway_error"}}';
  }

  location @rate_limited {
    internal;
    add_header X-Request-Id $request_id always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 1 always;
    return 429 '{"requestId":"$request_id","error":{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后重试","type":"gateway_error"}}';
  }

  location @upstream_400 {
    internal;
    return 400 '{"requestId":"$request_id","error":{"code":"UPSTREAM_REJECTED","message":"模型服务拒绝了该请求","type":"gateway_error"}}';
  }

  location @upstream_404 {
    internal;
    return 404 '{"requestId":"$request_id","error":{"code":"UPSTREAM_REJECTED","message":"模型服务拒绝了该请求","type":"gateway_error"}}';
  }

  location @upstream_409 {
    internal;
    return 409 '{"requestId":"$request_id","error":{"code":"UPSTREAM_REJECTED","message":"模型服务拒绝了该请求","type":"gateway_error"}}';
  }

  location @upstream_422 {
    internal;
    return 422 '{"requestId":"$request_id","error":{"code":"UPSTREAM_REJECTED","message":"模型服务拒绝了该请求","type":"gateway_error"}}';
  }

  location @auth_failed {
    internal;
    return 401 '{"requestId":"$request_id","error":{"code":"AUTHENTICATION_FAILED","message":"Key 无效或无权访问","type":"gateway_error"}}';
  }

  location @forbidden {
    internal;
    return 403 '{"requestId":"$request_id","error":{"code":"FORBIDDEN","message":"禁止访问","type":"gateway_error"}}';
  }

  location @gateway_unavailable {
    internal;
    return 502 '{"requestId":"$request_id","error":{"code":"GATEWAY_UNAVAILABLE","message":"模型服务暂时不可用","type":"gateway_error"}}';
  }

  location @gateway_timeout {
    internal;
    return 504 '{"requestId":"$request_id","error":{"code":"GATEWAY_TIMEOUT","message":"模型服务响应超时","type":"gateway_error"}}';
  }
}
