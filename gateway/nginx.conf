# P1-02 最小入口网关：只承担页面与 Portal 控制面转发，其余一律自有 404。
# 公共模型 Relay 路径在 LANG-P1-07 前保持关闭，不得指向 new-api。
upstream lang_api {
  server lang-api:8080;
}

server {
  listen 80;
  server_name _;

  # 自身健康检查（被 edge-nginx 健康检查与冒烟测试使用）
  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Lang API 页面与静态资源
  location / {
    proxy_pass http://lang_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Portal 控制面接口
  location /portal/api/ {
    proxy_pass http://lang_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 以下为 New API 管理与模型协议路径：P1-02 一律自有 404，不转发。
  location /v1/ {
    return 404 '{"message":"模型网关尚未开放"}';
  }

  location /v1beta/ {
    return 404 '{"message":"模型网关尚未开放"}';
  }

  location /api/ {
    return 404 '{"message":"请求的 Portal 接口不存在"}';
  }

  location /setup/ {
    return 404 '{"message":"请求的 Portal 接口不存在"}';
  }
}
